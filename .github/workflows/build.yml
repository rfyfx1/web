name: Build Rahbar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Rahbar.sln -c Release

      - name: Unit tests
        run: dotnet test tests/Rahbar.Core.Tests -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish (single Rahbar.exe, no .NET install needed)
        run: >
          dotnet publish src/Rahbar.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: Rahbar-win-x64
          path: publish/Rahbar.exe
